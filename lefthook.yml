# Ref: https://github.com/evilmartians/lefthook
# Install the git hooks with: uv run lefthook install

min_version: 2.0.5 # `args:` on script jobs

remotes:
  # The shared token-budget script. A tag, never a commit SHA. Bump `ref` to
  # update; the next commit fetches it.
  - git_url: https://github.com/simonsteiner/skills
    ref: filetokens.v1.0.0
    configs:
      - lefthook/file-tokens.yml

pre-commit:
  parallel: true
  jobs:
    # Every staged file an agent writes stays under 5,000 tokens (bytes / 4), so
    # an agent can read it whole. Lockfiles, build output, binaries and generated
    # files are skipped; mark more with linguist-generated in .gitattributes.
    # On failure it prints how to split the file. The script comes from the
    # remote above; the budget is set here.
    - name: file-tokens
      script: check-file-tokens.py
      runner: python3
      args: --max-tokens 5000 {staged_files}
  commands:
    # One job, not two: under `parallel: true` lefthook ignores `priority`, and
    # two fixers rewriting the same files at once undo each other's fixes.
    ruff:
      priority: 1
      glob: "*.py"
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      stage_fixed: true

    mypy:
      priority: 3
      glob: "*.py"
      run: uv run mypy

    # The only fixer of *.md, so it can run beside cspell. Config in .rumdl.toml.
    rumdl:
      priority: 4
      glob: "*.md"
      run: uv run rumdl check --fix {staged_files}
      stage_fixed: true

    cspell:
      priority: 4
      glob: "*.{py,md,toml,yml,yaml,json,html,js,css}"
      exclude:
        - "app/examples/**"
      run: npx --yes cspell --no-progress --no-must-find-files --config cspell.json {staged_files}

pre-push:
  commands:
    pytest:
      run: uv run pytest
