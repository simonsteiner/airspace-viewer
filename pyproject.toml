[build-system]
requires = ["setuptools>=84.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airspace-viewer"
version = "0.1.0"
description = "A Python-based interactive airspace visualization tool for viewing OpenAir airspace files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Simon Steiner", email = "simonsteiner@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Flask",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = ["airspace", "openair", "aviation", "gis", "visualization", "flask", "mapping"]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "openair-rs-py>=0.2.0",
    "simplekml>=1.3.6",
    "werkzeug>=3.1.8",
]

[dependency-groups]
dev = [
    "lefthook>=2.1.14",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.urls]
Repository = "https://github.com/simonsteiner/airspace-viewer"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W/F: pycodestyle + pyflakes (flake8), I: isort, D: pydocstyle
select = ["E", "W", "F", "I", "D"]
# E501 (line too long) is handled by the formatter
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Tests don't need the full pydocstyle docstring conventions
"tests/**" = ["D"]

[tool.mypy]
files = ["app", "tests", "application.py"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# simplekml ships no type information
module = ["simplekml"]
ignore_missing_imports = true
